  update-docs:
    runs-on: ubuntu-latest
    if: ${{ (('push' == 'repository_dispatch') && (github.event.action == 'update-docs')) }}
    steps:
    - name: Git Checkout
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
        ref: ${{ github.head_ref }}
    - name: Commit Changes
      run: |
        cd website
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        package_name="${{ github.event.client_payload.package_name }}"
        package_version="${{ github.event.client_payload.package_version }}"
        yarn add "$package_name@$package_version"
        git add package.json
        commit_message="Update $package_name to $package_version"
        git commit -m "$commit_message" || echo "No changes to commit"
    - name: Generate a token
      id: generate-tokens
      uses: actions/create-github-app-token@v3.2.0
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_SECRET }}
        owner: ${{ github.repository_owner }}
    - name: Create Pull Request to Update Docs
